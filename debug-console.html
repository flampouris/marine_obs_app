<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine App - Console Debugger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Courier New', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
    }
    h1 { color: #4ec9b0; margin-bottom: 20px; }
    #console {
      background: #252526;
      border: 1px solid #3e3e42;
      padding: 15px;
      border-radius: 4px;
      height: 600px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.6;
    }
    .error { color: #f48771; }
    .warn { color: #dcdcaa; }
    .info { color: #569cd6; }
    .log { color: #d4d4d4; }
    .success { color: #4ec9b0; }
    .timestamp { color: #858585; margin-right: 8px; }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px 5px 10px 0;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover { background: #0052a3; }
  </style>
</head>
<body>
  <h1>🔍 Marine App - Console Debugger</h1>
  <div>
    <button onclick="clearConsole()">Clear Console</button>
    <button onclick="testDataFiles()">Test Data Files</button>
  </div>
  <div id="console"></div>

  <script>
    const consoleDiv = document.getElementById('console');
    let logCount = 0;

    // Intercept all console methods
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    const originalInfo = console.info;

    function addToConsole(message, type = 'log') {
      logCount++;
      const line = document.createElement('div');
      line.className = type;
      const time = new Date().toLocaleTimeString();
      line.innerHTML = `<span class="timestamp">[${time}]</span>${escapeHtml(String(message))}`;
      consoleDiv.appendChild(line);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    console.log = function(...args) {
      addToConsole(args.join(' '), 'log');
      originalLog.apply(console, args);
    };

    console.error = function(...args) {
      addToConsole(args.join(' '), 'error');
      originalError.apply(console, args);
    };

    console.warn = function(...args) {
      addToConsole(args.join(' '), 'warn');
      originalWarn.apply(console, args);
    };

    console.info = function(...args) {
      addToConsole(args.join(' '), 'info');
      originalInfo.apply(console, args);
    };

    // Capture unhandled errors
    window.addEventListener('error', (e) => {
      addToConsole(`UNHANDLED ERROR: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
    });

    window.addEventListener('unhandledrejection', (e) => {
      addToConsole(`UNHANDLED PROMISE REJECTION: ${e.reason}`, 'error');
    });

    function clearConsole() {
      consoleDiv.innerHTML = '';
      logCount = 0;
      addToConsole('Console cleared', 'info');
    }

    async function testDataFiles() {
      addToConsole('Testing data file accessibility...', 'info');
      
      const files = [
        'global_marine_observation_source_registry_v3.json',
        'marine_parameter_dictionary_v3.json'
      ];

      for (const file of files) {
        try {
          const response = await fetch(file);
          if (response.ok) {
            const data = await response.json();
            addToConsole(`✓ ${file}: ${response.status} OK (${Object.keys(data).length} keys)`, 'success');
          } else {
            addToConsole(`✗ ${file}: ${response.status} ${response.statusText}`, 'error');
          }
        } catch (e) {
          addToConsole(`✗ ${file}: ${e.message}`, 'error');
        }
      }
    }

    // Initial message
    window.addEventListener('load', () => {
      addToConsole('Console debugger loaded', 'info');
      addToConsole('Current URL: ' + window.location.href, 'info');
      addToConsole('Waiting for app to load...', 'info');
      setTimeout(() => {
        addToConsole('If you see errors below, copy them and share with support', 'warn');
      }, 2000);
    });
  </script>
</body>
</html>
