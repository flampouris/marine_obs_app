name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify HTML and JavaScript element IDs
        shell: pwsh
        run: ./test-ui-contract.ps1

      - name: Verify exclusive v3 runtime inputs
        shell: pwsh
        run: ./test-v3-inputs.ps1

      - name: Generate static source and parameter pages
        shell: pwsh
        run: ./generate-seo-pages.ps1

      - name: Validate SEO pages and metadata
        shell: pwsh
        run: ./test-seo-pages.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
